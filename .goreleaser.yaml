# GoReleaser config for the kmx CLI. Run from `.github/workflows/release.yml`,
# never by hand against a real tag — see docs/releases.md#cutting-a-release.
#
# Keyless, like the rest of this project's CI (docs/releases.md,
# .github/workflows/ci.yml's "release job stays keyless" check): the workflow
# invokes GoReleaser with publishing disabled, validates its output, then gives
# those exact files to `gh release create`. `brews.skip_upload` below is
# defense in depth: even another invocation that enables publishing must not
# push to kaimahi-agents/homebrew-tap, which remains a reviewed human PR.
version: 2

project_name: kmx

# The tag is supplied by the workflow (GORELEASER_CURRENT_TAG), including for
# dry runs that do not correspond to a real git tag — see the "Decide what is
# being built" step in release.yml. Nothing here re-derives a version from git.
builds:
  - id: kmx
    main: ./cmd/kmx
    binary: kmx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Six targets: the four Unix platforms every published release carries,
    # plus native Windows amd64/arm64 for releases cut from this config. No
    # published release contains a Windows binary yet (docs/releases.md).
    # Native filesystem qualification retired the platform guard. The release
    # workflow verifies all six artifacts, provenance and checksums before upload.
    #
    # Remove checkout paths from compiled binaries. The release workflow
    # separately checks the embedded VCS revision and clean-tree provenance.
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kaimahi-agents/kaimahi/internal/kmx/version.Tag={{ .Tag }}

archives:
  # No archive: the release ships bare binaries, matching install.sh,
  # docs/releases.md's "by hand" instructions and the sha256sum-based
  # checksum verification they document. The binary format appends the build
  # extension, so Windows assets are kmx-windows-amd64.exe and
  # kmx-windows-arm64.exe; Unix asset names are unchanged.
  - formats: ["binary"]
    name_template: "kmx-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  name_template: "{{ .Tag }}"
  prerelease: auto

# Rendered locally into dist/homebrew/Formula/kmx.rb and never pushed from
# here (skip_upload: true). GoReleaser's brew pipe selects only darwin and
# linux artifacts, so the formula keeps the four Unix assets and no Windows.
# The release workflow checks that. A maintainer downloads that exact asset and opens
# a reviewed pull request against kaimahi-agents/homebrew-tap — see
# docs/releases.md#cutting-a-release, step 5.
brews:
  - name: kmx
    repository:
      owner: kaimahi-agents
      name: homebrew-tap
    skip_upload: true
    directory: Formula
    homepage: "https://github.com/kaimahi-agents/kaimahi"
    description: "Agent Builder CLI for Kubernetes"
    license: "MIT"
    commit_msg_template: "Brew formula update for kmx version {{ .Tag }}"
    # Check the installed version without coupling packaging to help prose.
    test: |
      assert_equal "v#{version}", shell_output("#{bin}/kmx version").split.fetch(1)
